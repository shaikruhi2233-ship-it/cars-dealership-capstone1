services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
  express:
    build: ./express-service
    ports: ["5000:5000"]
    environment:
      MONGO_URI: mongodb://mongo:27017/cars
    depends_on: [mongo]
